apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: airflow-kserve-deployer
  namespace: default
rules:
- apiGroups: ["serving.kserve.io"]
  resources: ["inferenceservices"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: airflow-kserve-deployer-binding
  namespace: default
subjects:
- kind: ServiceAccount
  name: airflow-worker
  namespace: airflow
roleRef:
  kind: Role
  name: airflow-kserve-deployer
  apiGroup: rbac.authorization.k8s.io

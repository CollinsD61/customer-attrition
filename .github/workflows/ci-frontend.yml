# CI cho frontend (Vite + TypeScript).
# Riêng file này vì toolchain (npm) khác hẳn Python backend.
# Kết nối: required check trên PR. Build ở đây đảm bảo `npm run build` không vỡ
# trước khi deploy-frontend.yml dựng image.
name: CI Frontend

on:
  pull_request:
    paths: ['frontend/**']
  push:
    branches: [main]
    paths: ['frontend/**']

concurrency:
  group: ci-frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install deps
        working-directory: frontend
        run: npm ci

      - name: Lint + typecheck
        working-directory: frontend
        run: npm run lint && npm run typecheck

      - name: Unit tests
        working-directory: frontend
        run: npm test

      - name: Build (đảm bảo tạo được bundle)
        working-directory: frontend
        run: npm run build

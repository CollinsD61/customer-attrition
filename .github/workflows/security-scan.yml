# Security scan — gate bắt buộc trước merge, khớp với rule AGENTS.md
# "Secrets must never be committed".
# Kết nối: required check trên PR. Chặn deploy nếu phát hiện secret/dependency lỗ hổng.
name: Security Scan

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Chạy định kỳ vì dependency lỗ hổng mới xuất hiện mỗi ngày, không phải chỉ lúc PR
    - cron: '0 3 * * 1'  # 3h sáng thứ Hai

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # gitleaks cần history để soi toàn bộ commits

      - name: Gitleaks (scan secrets trong git history)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: pip-audit (CVE trong requirements)
        run: |
          pip install pip-audit
          pip-audit -r backend/requirements.txt -r requirements-dev.txt --ignore-vulns no

  dependency-npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: npm audit (CVE trong package.json)
        working-directory: frontend
        run: npm audit --audit-level=high

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Trivy (quét image backend)
        uses: aquasecurity/trivy-action@0.30.0
        with:
          image-ref: docker.io/library/nginx:latest  # ponytail: placeholder — thay bằng image thật
          format: table
          exit-code: '1'
          severity: HIGH,CRITICAL
